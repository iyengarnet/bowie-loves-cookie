<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Dog Cookie Race</title>

<style>
* {
  box-sizing: border-box;
}

body {
  margin: 0;
  padding: 20px;
  font-family: Arial, sans-serif;
  text-align: center;
  background: linear-gradient(135deg, #dff6ff, #fff4d6);
}

h1 {
  margin: 0 0 8px;
}

#status {
  margin-bottom: 12px;
  color: #555;
  font-size: 18px;
}

#maze {
  display: grid;
  grid-template-columns: repeat(11, 1fr);
  gap: 2px;
  width: min(94vw, 590px);
  margin: auto;
  padding: 6px;
  background: #cbd5e1;
  border-radius: 16px;
}

.cell {
  position: relative;
  aspect-ratio: 1;
  background: #fffdf7;
  border-radius: 3px;
}

.wall {
  background: #475569;
}

.dog {
  position: absolute;
  inset: 4%;
  z-index: 3;
  display: grid;
  place-items: center;
  border-radius: 50%;
  font-size: clamp(18px, 5vw, 32px);
  cursor: pointer;
  user-select: none;
  box-shadow: 0 3px 6px rgba(0, 0, 0, .3);
  animation: run .16s infinite alternate;
}

.cookie {
  position: absolute;
  inset: 5%;
  display: grid;
  place-items: center;
  font-size: clamp(20px, 5vw, 34px);
  animation: cookieBob .45s infinite alternate;
}

@keyframes run {
  from {
    transform: scale(1);
  }

  to {
    transform: scale(1.12) rotate(5deg);
  }
}

@keyframes cookieBob {
  from {
    transform: translateY(0);
  }

  to {
    transform: translateY(-4px) rotate(7deg);
  }
}

button {
  border: 0;
  padding: 12px 20px;
  margin: 12px 0;
  border-radius: 12px;
  background: #111827;
  color: white;
  font-size: 16px;
  font-weight: bold;
  cursor: pointer;
}

button:hover {
  background: #374151;
}

#bark {
  min-height: 28px;
  margin-top: 12px;
  font-size: 20px;
  font-weight: bold;
}

#result {
  width: min(94vw, 590px);
  margin: 12px auto;
  padding: 16px;
  border: 2px solid #f59e0b;
  border-radius: 14px;
  background: #fff3c4;
  font-size: 20px;
  font-weight: bold;
}

.legend {
  display: flex;
  justify-content: center;
  flex-wrap: wrap;
  gap: 8px;
  max-width: 590px;
  margin: 12px auto;
  font-weight: bold;
}

.legend span {
  padding: 6px 10px;
  border-radius: 10px;
  color: white;
}

.bowie {
  background: #ef4444;
}

.lolly {
  background: #ec4899;
}

.morgan {
  background: #3b82f6;
}

.millie {
  background: #8b5cf6;
}
</style>
</head>

<body>

<h1>🐶 Dog Cookie Race 🍪</h1>

<div id="status">
  Touch any dog to start the race!
</div>

<button id="newRace">🏁 New Race</button>

<div class="legend">
  <span class="bowie">Bowie</span>
  <span class="lolly">Lolly</span>
  <span class="morgan">Morgan</span>
  <span class="millie">Millie</span>
</div>

<div id="maze"></div>

<div id="result" hidden></div>

<div id="bark">🐾 TOUCH A DOG!</div>

<script>
"use strict";

const mazeElement = document.getElementById("maze");
const statusElement = document.getElementById("status");
const barkElement = document.getElementById("bark");
const resultElement = document.getElementById("result");
const newRaceButton = document.getElementById("newRace");

const WIDTH = 11;
const HEIGHT = 11;

const dogNames = [
  "Bowie",
  "Lolly",
  "Morgan",
  "Millie"
];

const dogColors = [
  "#ef4444",
  "#ec4899",
  "#3b82f6",
  "#8b5cf6"
];

const directions = [
  [1, 0],
  [-1, 0],
  [0, 1],
  [0, -1]
];

let dogs = [];
let cookie = { x: 5, y: 5 };
let walls = new Set();

let raceRunning = false;
let raceTimer = null;
let raceStartTime = 0;

let audioContext = null;


/* ============================
   BASIC HELPERS
============================ */

function positionKey(x, y) {
  return `${x},${y}`;
}

function isInside(x, y) {
  return (
    x >= 0 &&
    x < WIDTH &&
    y >= 0 &&
    y < HEIGHT
  );
}

function isOpen(x, y) {
  return (
    isInside(x, y) &&
    !walls.has(positionKey(x, y))
  );
}

function getNeighbors(x, y) {
  return directions
    .map(([dx, dy]) => [x + dx, y + dy])
    .filter(([nx, ny]) => isInside(nx, ny));
}


/* ============================
   PATH CHECK
============================ */

function pathExists(start, goal, blocked) {

  const queue = [start];

  const visited = new Set([
    positionKey(start[0], start[1])
  ]);

  while (queue.length > 0) {

    const [x, y] = queue.shift();

    if (
      x === goal[0] &&
      y === goal[1]
    ) {
      return true;
    }

    for (const [nx, ny] of getNeighbors(x, y)) {

      const key = positionKey(nx, ny);

      if (
        !blocked.has(key) &&
        !visited.has(key)
      ) {
        visited.add(key);
        queue.push([nx, ny]);
      }
    }
  }

  return false;
}


/* ============================
   CREATE NEW MAZE

   A new maze is created only
   when New Race is pressed.
============================ */

function createMaze() {

  const starts = [
    [0, 0],
    [0, 10],
    [10, 0],
    [10, 10]
  ];

  const goal = [5, 5];

  for (let attempt = 0; attempt < 500; attempt++) {

    const newWalls = new Set();

    for (let y = 0; y < HEIGHT; y++) {

      for (let x = 0; x < WIDTH; x++) {

        const isStart = starts.some(
          ([sx, sy]) =>
            sx === x && sy === y
        );

        const isGoal =
          x === goal[0] &&
          y === goal[1];

        if (
          !isStart &&
          !isGoal &&
          Math.random() < 0.22
        ) {
          newWalls.add(
            positionKey(x, y)
          );
        }
      }
    }

    /*
      Keep four clear corridors.
    */

    for (let y = 0; y < HEIGHT; y++) {
      newWalls.delete(
        positionKey(1, y)
      );

      newWalls.delete(
        positionKey(9, y)
      );
    }

    for (let x = 0; x < WIDTH; x++) {
      newWalls.delete(
        positionKey(x, 1)
      );

      newWalls.delete(
        positionKey(x, 9)
      );
    }

    /*
      Confirm that ALL four dogs
      have a route to the Cookie.
    */

    const valid = starts.every(start =>
      pathExists(start, goal, newWalls)
    );

    if (valid) {
      return newWalls;
    }
  }

  /*
    Guaranteed fallback.
  */

  return new Set();
}


/* ============================
   DRAW MAZE
============================ */

function drawMaze() {

  mazeElement.innerHTML = "";

  for (let y = 0; y < HEIGHT; y++) {

    for (let x = 0; x < WIDTH; x++) {

      const cell =
        document.createElement("div");

      cell.className = "cell";

      if (
        walls.has(
          positionKey(x, y)
        )
      ) {
        cell.classList.add("wall");
      }

      /*
        Dog
      */

      const dogIndex =
        dogs.findIndex(
          dog =>
            dog.x === x &&
            dog.y === y
        );

      if (dogIndex !== -1) {

        const dogElement =
          document.createElement("div");

        dogElement.className = "dog";

        dogElement.style.background =
          dogColors[dogIndex];

        dogElement.textContent = "🐶";

        dogElement.title =
          `${dogNames[dogIndex]} — touch to start`;

        dogElement.addEventListener(
          "pointerdown",
          startRace
        );

        cell.appendChild(
          dogElement
        );
      }

      /*
        Cookie
      */

      if (
        cookie.x === x &&
        cookie.y === y
      ) {

        const cookieElement =
          document.createElement("div");

        cookieElement.className =
          "cookie";

        cookieElement.textContent = "🍪";

        cell.appendChild(
          cookieElement
        );
      }

      mazeElement.appendChild(cell);
    }
  }
}


/* ============================
   BARK SOUND
============================ */

function makeBarkSound() {

  try {

    if (!audioContext) {

      const AudioContext =
        window.AudioContext ||
        window.webkitAudioContext;

      if (!AudioContext) {
        return;
      }

      audioContext =
        new AudioContext();
    }

    if (
      audioContext.state === "suspended"
    ) {
      audioContext.resume();
    }

    const now =
      audioContext.currentTime;

    [0, 0.2].forEach(
      (delay, index) => {

        const oscillator =
          audioContext.createOscillator();

        const gain =
          audioContext.createGain();

        const frequency =
          index === 0 ? 330 : 270;

        oscillator.type = "square";

        oscillator.frequency.setValueAtTime(
          frequency,
          now + delay
        );

        oscillator.frequency
          .exponentialRampToValueAtTime(
            frequency * 0.55,
            now + delay + 0.12
          );

        gain.gain.setValueAtTime(
          0.0001,
          now + delay
        );

        gain.gain
          .exponentialRampToValueAtTime(
            0.12,
            now + delay + 0.015
          );

        gain.gain
          .exponentialRampToValueAtTime(
            0.0001,
            now + delay + 0.14
          );

        oscillator.connect(gain);

        gain.connect(
          audioContext.destination
        );

        oscillator.start(
          now + delay
        );

        oscillator.stop(
          now + delay + 0.15
        );
      }
    );

  } catch (error) {
    // Game continues without sound.
  }
}


/* ============================
   DISTANCE MAP

   Calculates the shortest path
   from every reachable square
   to the Cookie.
============================ */

function getDistanceMapToCookie() {

  const distances = new Map();

  const queue = [
    [cookie.x, cookie.y]
  ];

  distances.set(
    positionKey(cookie.x, cookie.y),
    0
  );

  while (queue.length > 0) {

    const [x, y] =
      queue.shift();

    const currentDistance =
      distances.get(
        positionKey(x, y)
      );

    for (
      const [nx, ny]
      of getNeighbors(x, y)
    ) {

      const key =
        positionKey(nx, ny);

      if (
        isOpen(nx, ny) &&
        !distances.has(key)
      ) {

        distances.set(
          key,
          currentDistance + 1
        );

        queue.push([
          nx,
          ny
        ]);
      }
    }
  }

  return distances;
}


/* ============================
   CHOOSE BEST DIRECTION
============================ */

function chooseDirection(
  dog,
  distanceMap
) {

  const possible =
    directions
      .map(([dx, dy]) => ({
        dx,
        dy,
        x: dog.x + dx,
        y: dog.y + dy
      }))
      .filter(move =>
        isOpen(move.x, move.y)
      );

  if (possible.length === 0) {
    return null;
  }

  const scored =
    possible.map(move => ({
      ...move,
      distance:
        distanceMap.get(
          positionKey(
            move.x,
            move.y
          )
        ) ?? Infinity
    }));

  const bestDistance =
    Math.min(
      ...scored.map(
        move => move.distance
      )
    );

  let bestMoves =
    scored.filter(
      move =>
        move.distance ===
        bestDistance
    );

  /*
    Avoid immediately turning around
    when another equally good choice exists.
  */

  if (
    dog.direction &&
    bestMoves.length > 1
  ) {

    const [oldDx, oldDy] =
      dog.direction;

    const notReverse =
      bestMoves.filter(move =>
        !(
          move.dx === -oldDx &&
          move.dy === -oldDy
        )
      );

    if (notReverse.length > 0) {
      bestMoves = notReverse;
    }
  }

  const selected =
    bestMoves[
      Math.floor(
        Math.random() *
        bestMoves.length
      )
    ];

  return [
    selected.dx,
    selected.dy
  ];
}


/* ============================
   MOVE DOG

   Dogs move straight until
   they hit a wall or edge.

   At that point they choose
   the direction that follows
   the shortest route to Cookie.
============================ */

function moveDog(
  dog,
  distanceMap
) {

  /*
    Continue straight.
    This is the important part:
    the dog does NOT randomly turn
    at every square.
  */

  if (dog.direction) {

    const [dx, dy] =
      dog.direction;

    const nextX =
      dog.x + dx;

    const nextY =
      dog.y + dy;

    if (
      isOpen(nextX, nextY)
    ) {

      dog.x = nextX;
      dog.y = nextY;

      return;
    }
  }

  /*
    Wall or edge reached.
    Choose a new direction based
    on the shortest route to Cookie.
  */

  dog.direction =
    chooseDirection(
      dog,
      distanceMap
    );

  if (!dog.direction) {
    return;
  }

  dog.x += dog.direction[0];
  dog.y += dog.direction[1];
}


/* ============================
   START
============================ */

function startRace() {

  if (raceRunning) {
    return;
  }

  raceRunning = true;

  raceStartTime =
    performance.now();

  statusElement.textContent =
    "🏁 RACE! GO DOGS!";

  barkElement.textContent =
    "🐶 WOOF! WOOF! WOOF!";

  resultElement.hidden = true;

  makeBarkSound();

  raceTimer =
    setInterval(
      raceStep,
      330
    );
}


/* ============================
   RACE
============================ */

function raceStep() {

  /*
    Calculate the shortest route
    to Cookie once per race step.
  */

  const distanceMap =
    getDistanceMapToCookie();

  /*
    Move every dog toward Cookie.
  */

  dogs.forEach(dog => {
    moveDog(
      dog,
      distanceMap
    );
  });

  makeBarkSound();

  barkElement.textContent =
    `${dogNames[
      Math.floor(
        Math.random() *
        dogNames.length
      )
    ]}: WOOF! WOOF! 🐾`;

  drawMaze();

  /*
    Check for winner.
  */

  const winnerIndex =
    dogs.findIndex(
      dog =>
        dog.x === cookie.x &&
        dog.y === cookie.y
    );

  if (winnerIndex !== -1) {
    finishRace(winnerIndex);
  }
}


/* ============================
   WINNER
============================ */

function finishRace(
  winnerIndex
) {

  const elapsedSeconds =
    (
      (
        performance.now() -
        raceStartTime
      ) / 1000
    ).toFixed(2);

  clearInterval(
    raceTimer
  );

  raceTimer = null;

  raceRunning = false;

  statusElement.textContent =
    "🏆 Race finished!";

  barkElement.textContent =
    `🐶 ${dogNames[winnerIndex]}: WOOOOOOF! 🍪`;

  resultElement.hidden = false;

  resultElement.innerHTML = `
    🏆 Winner:
    <strong>
      ${dogNames[winnerIndex]}
    </strong>
    <br>
    ⏱️ Time:
    <strong>
      ${elapsedSeconds} seconds
    </strong>
  `;

  makeBarkSound();

  drawMaze();
}


/* ============================
   NEW RACE
============================ */

function newRace() {

  clearInterval(
    raceTimer
  );

  raceTimer = null;

  raceRunning = false;

  dogs = [
    {
      x: 0,
      y: 0,
      direction: null
    },
    {
      x: 0,
      y: 10,
      direction: null
    },
    {
      x: 10,
      y: 0,
      direction: null
    },
    {
      x: 10,
      y: 10,
      direction: null
    }
  ];

  cookie = {
    x: 5,
    y: 5
  };

  /*
    Generate a completely new maze.
    It will NOT change during the race.
  */

  walls = createMaze();

  resultElement.hidden = true;

  statusElement.textContent =
    "Touch any dog to start the race!";

  barkElement.textContent =
    "🐾 TOUCH A DOG!";

  drawMaze();
}


/* ============================
   BUTTON
============================ */

newRaceButton.addEventListener(
  "click",
  newRace
);


/* ============================
   START GAME
============================ */

newRace();

</script>

</body>
</html>
