
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Dog Cookie Race</title>

<style>
* { box-sizing: border-box; }

body {
  margin: 0;
  padding: 18px;
  font-family: Arial, sans-serif;
  text-align: center;
  background: linear-gradient(135deg, #dff6ff, #fff0c7);
}

h1 {
  margin: 4px 0 8px;
  font-size: clamp(26px, 7vw, 42px);
}

#status {
  font-size: 18px;
  font-weight: bold;
  margin-bottom: 8px;
}

#maze {
  display: grid;
  grid-template-columns: repeat(15, 1fr);
  gap: 1px;
  width: min(96vw, 650px);
  margin: 12px auto;
  padding: 5px;
  background: #64748b;
  border-radius: 14px;
  touch-action: manipulation;
}

.cell {
  position: relative;
  aspect-ratio: 1;
  background: #fffdf5;
}

.wall {
  background: #374151;
}

.dog {
  position: absolute;
  inset: 2%;
  z-index: 5;
  display: grid;
  place-items: center;
  border-radius: 50%;
  font-size: clamp(15px, 4vw, 29px);
  cursor: pointer;
  user-select: none;
  box-shadow: 0 2px 5px rgba(0,0,0,.35);
  animation: bounce .14s infinite alternate;
}

@keyframes bounce {
  from { transform: scale(1); }
  to { transform: scale(1.13) rotate(4deg); }
}

.cookie {
  position: absolute;
  inset: 0;
  display: grid;
  place-items: center;
  z-index: 4;
  font-size: clamp(18px, 5vw, 34px);
  animation: cookie .4s infinite alternate;
}

@keyframes cookie {
  to {
    transform: translateY(-3px) rotate(8deg);
  }
}

button {
  border: 0;
  border-radius: 12px;
  padding: 12px 20px;
  background: #111827;
  color: white;
  font-size: 17px;
  font-weight: bold;
  cursor: pointer;
}

button:hover {
  background: #374151;
}

.legend {
  display: flex;
  justify-content: center;
  flex-wrap: wrap;
  gap: 6px;
  margin: 10px auto;
}

.legend span {
  padding: 6px 10px;
  border-radius: 9px;
  color: white;
  font-weight: bold;
}

.bowie { background:#ef4444; }
.lolly { background:#ec4899; }
.morgan { background:#3b82f6; }
.millie { background:#8b5cf6; }

#bark {
  min-height: 28px;
  margin-top: 8px;
  font-size: 19px;
  font-weight: bold;
}

#result {
  width: min(96vw, 650px);
  margin: 12px auto;
  padding: 15px;
  border-radius: 14px;
  border: 2px solid #f59e0b;
  background: #fff3c4;
  font-size: 20px;
  font-weight: bold;
}
</style>
</head>

<body>

<h1>🐶 Dog Cookie Race 🍪</h1>

<div id="status">
  Touch any dog to START!
</div>

<button id="newRace">🏁 NEW RACE</button>

<div class="legend">
  <span class="bowie">Bowie</span>
  <span class="lolly">Lolly</span>
  <span class="morgan">Morgan</span>
  <span class="millie">Millie</span>
</div>

<div id="maze"></div>

<div id="result" hidden></div>

<div id="bark">🐾 TOUCH A DOG!</div>


<script>
"use strict";

/* =========================================
   SETTINGS
========================================= */

const SIZE = 15;

const DOG_NAMES = [
  "Bowie",
  "Lolly",
  "Morgan",
  "Millie"
];

const DOG_COLORS = [
  "#ef4444",
  "#ec4899",
  "#3b82f6",
  "#8b5cf6"
];

const STARTS = [
  [0, 0],
  [0, SIZE - 1],
  [SIZE - 1, 0],
  [SIZE - 1, SIZE - 1]
];

const COOKIE = {
  x: Math.floor(SIZE / 2),
  y: Math.floor(SIZE / 2)
};

const DIRECTIONS = [
  { dx: 1, dy: 0 },
  { dx: -1, dy: 0 },
  { dx: 0, dy: 1 },
  { dx: 0, dy: -1 }
];


/* =========================================
   GAME STATE
========================================= */

let maze = [];
let dogs = [];

let raceRunning = false;
let raceTimer = null;
let raceStart = 0;

let audioContext = null;


/* =========================================
   DOM
========================================= */

const mazeElement =
  document.getElementById("maze");

const statusElement =
  document.getElementById("status");

const barkElement =
  document.getElementById("bark");

const resultElement =
  document.getElementById("result");

const newRaceButton =
  document.getElementById("newRace");


/* =========================================
   MAZE HELPERS
========================================= */

function key(x, y) {
  return `${x},${y}`;
}

function inside(x, y) {
  return (
    x >= 0 &&
    x < SIZE &&
    y >= 0 &&
    y < SIZE
  );
}

function open(x, y) {
  return (
    inside(x, y) &&
    maze[y][x] === 0
  );
}

function validNeighbors(x, y) {

  return DIRECTIONS
    .map(d => [
      x + d.dx,
      y + d.dy
    ])
    .filter(([nx, ny]) =>
      open(nx, ny)
    );
}


/* =========================================
   CREATE MAZE

   Maze changes only between races.
========================================= */

function createMaze() {

  /*
    Start with open cells.
  */

  maze =
    Array.from(
      { length: SIZE },
      () => Array(SIZE).fill(0)
    );

  /*
    Add random walls.
  */

  for (let y = 0; y < SIZE; y++) {

    for (let x = 0; x < SIZE; x++) {

      const isStart =
        STARTS.some(
          ([sx, sy]) =>
            sx === x && sy === y
        );

      const isCookie =
        x === COOKIE.x &&
        y === COOKIE.y;

      /*
        Keep starts and Cookie open.
      */

      if (
        isStart ||
        isCookie
      ) {
        continue;
      }

      if (Math.random() < 0.25) {
        maze[y][x] = 1;
      }
    }
  }

  /*
    Keep four broad routes open.
    This prevents overly difficult mazes.
  */

  for (let y = 0; y < SIZE; y++) {

    maze[y][1] = 0;
    maze[y][SIZE - 2] = 0;
  }

  for (let x = 0; x < SIZE; x++) {

    maze[1][x] = 0;
    maze[SIZE - 2][x] = 0;
  }

  /*
    Make sure every dog can reach
    the Cookie.

    If not, regenerate.
  */

  if (!allDogsCanReachCookie()) {
    createMaze();
  }
}


/* =========================================
   PATH CHECK
========================================= */

function distanceFromCookie() {

  const distances = new Map();

  const queue = [
    [COOKIE.x, COOKIE.y]
  ];

  distances.set(
    key(COOKIE.x, COOKIE.y),
    0
  );

  while (queue.length) {

    const [x, y] =
      queue.shift();

    const current =
      distances.get(
        key(x, y)
      );

    for (
      const [nx, ny]
      of validNeighbors(x, y)
    ) {

      const k = key(nx, ny);

      if (!distances.has(k)) {

        distances.set(
          k,
          current + 1
        );

        queue.push([
          nx,
          ny
        ]);
      }
    }
  }

  return distances;
}


function allDogsCanReachCookie() {

  const distances =
    distanceFromCookie();

  return STARTS.every(
    ([x, y]) =>
      distances.has(key(x, y))
  );
}


/* =========================================
   DRAW
========================================= */

function draw() {

  mazeElement.innerHTML = "";

  for (let y = 0; y < SIZE; y++) {

    for (let x = 0; x < SIZE; x++) {

      const cell =
        document.createElement("div");

      cell.className = "cell";

      if (maze[y][x] === 1) {
        cell.classList.add("wall");
      }

      /*
        Cookie
      */

      if (
        x === COOKIE.x &&
        y === COOKIE.y
      ) {

        const cookie =
          document.createElement("div");

        cookie.className = "cookie";

        cookie.textContent = "🍪";

        cell.appendChild(cookie);
      }

      /*
        Dogs
      */

      dogs.forEach((dog, index) => {

        if (
          dog.x === x &&
          dog.y === y
        ) {

          const dogElement =
            document.createElement("div");

          dogElement.className = "dog";

          dogElement.style.background =
            DOG_COLORS[index];

          dogElement.textContent = "🐶";

          dogElement.title =
            `${DOG_NAMES[index]} — START`;

          dogElement.addEventListener(
            "pointerdown",
            startRace
          );

          cell.appendChild(
            dogElement
          );
        }
      });

      mazeElement.appendChild(cell);
    }
  }
}


/* =========================================
   SOUND
========================================= */

function bark() {

  barkElement.textContent =
    DOG_NAMES[
      Math.floor(
        Math.random() *
        DOG_NAMES.length
      )
    ] + ": WOOF! WOOF! 🐾";

  try {

    if (!audioContext) {

      const AudioContext =
        window.AudioContext ||
        window.webkitAudioContext;

      if (!AudioContext) return;

      audioContext =
        new AudioContext();
    }

    if (
      audioContext.state === "suspended"
    ) {
      audioContext.resume();
    }

    const now =
      audioContext.currentTime;

    [0, 0.18].forEach(
      (delay, i) => {

        const oscillator =
          audioContext.createOscillator();

        const gain =
          audioContext.createGain();

        oscillator.type = "sawtooth";

        oscillator.frequency.setValueAtTime(
          i === 0 ? 310 : 250,
          now + delay
        );

        oscillator.frequency
          .exponentialRampToValueAtTime(
            i === 0 ? 150 : 120,
            now + delay + 0.12
          );

        gain.gain.setValueAtTime(
          0.0001,
          now + delay
        );

        gain.gain
          .exponentialRampToValueAtTime(
            0.13,
            now + delay + 0.02
          );

        gain.gain
          .exponentialRampToValueAtTime(
            0.0001,
            now + delay + 0.14
          );

        oscillator.connect(gain);
        gain.connect(
          audioContext.destination
        );

        oscillator.start(
          now + delay
        );

        oscillator.stop(
          now + delay + 0.15
        );
      }
    );

  } catch (e) {
    // Sound is optional.
  }
}


/* =========================================
   IMPORTANT MOVEMENT LOGIC

   Dogs are RANDOM but strongly biased
   toward the Cookie.

   They:
   1. Continue straight when possible.
   2. When blocked, examine possible turns.
   3. Strongly favor directions that reduce
      their actual maze distance to Cookie.
   4. Occasionally choose another valid
      direction, keeping the race unpredictable.
========================================= */

function moveDog(
  dog,
  distanceMap
) {

  /*
    STEP 1:
    Continue straight if possible.

    This makes the dog travel down
    corridors instead of twitching
    from square to square.
  */

  if (dog.direction) {

    const nx =
      dog.x + dog.direction.dx;

    const ny =
      dog.y + dog.direction.dy;

    if (open(nx, ny)) {

      /*
        Usually continue straight.

        There is a small chance to
        reconsider at an intersection.
      */

      const nearby =
        validNeighbors(
          dog.x,
          dog.y
        );

      const isJunction =
        nearby.length >= 3;

      if (
        !isJunction ||
        Math.random() < 0.82
      ) {

        dog.x = nx;
        dog.y = ny;

        return;
      }
    }
  }


  /*
    STEP 2:
    We hit a wall/edge or decided
    to reconsider.

    Find all available directions.
  */

  let choices =
    DIRECTIONS
      .map(d => {

        const nx =
          dog.x + d.dx;

        const ny =
          dog.y + d.dy;

        if (!open(nx, ny)) {
          return null;
        }

        return {
          direction: d,
          distance:
            distanceMap.get(
              key(nx, ny)
            ) ?? Infinity
        };
      })
      .filter(Boolean);


  if (!choices.length) {
    return;
  }


  /*
    STEP 3:
    Convert maze distance into
    weighted probabilities.

    LOWER distance = MUCH higher weight.

    This is the key change that makes
    the dogs target the Cookie rapidly
    without becoming perfectly predictable.
  */

  choices =
    choices.map(choice => {

      const d =
        choice.distance;

      let weight;

      if (d === Infinity) {

        weight = 0.02;

      } else {

        /*
          Exponential preference for
          shorter routes.

          A direction that is only a
          little closer gets a useful
          chance, but the best route
          gets a much larger chance.
        */

        weight =
          Math.exp(-0.38 * d);
      }

      /*
        Add a small randomness factor.
      */

      weight *=
        0.85 +
        Math.random() * 0.30;

      /*
        Avoid immediate reversal when
        another direction is available.
      */

      if (dog.direction) {

        const reverse =
          choice.direction.dx ===
            -dog.direction.dx &&
          choice.direction.dy ===
            -dog.direction.dy;

        if (reverse) {
          weight *= 0.12;
        }
      }

      return {
        ...choice,
        weight
      };
    });


  /*
    STEP 4:
    Weighted random selection.
  */

  const totalWeight =
    choices.reduce(
      (sum, choice) =>
        sum + choice.weight,
      0
    );

  let random =
    Math.random() * totalWeight;

  let selected =
    choices[choices.length - 1];

  for (const choice of choices) {

    random -= choice.weight;

    if (random <= 0) {

      selected = choice;
      break;
    }
  }


  /*
    STEP 5:
    Set direction and immediately move.
  */

  dog.direction =
    selected.direction;

  dog.x +=
    dog.direction.dx;

  dog.y +=
    dog.direction.dy;
}


/* =========================================
   START RACE
========================================= */

function startRace() {

  if (raceRunning) {
    return;
  }

  raceRunning = true;

  raceStart =
    performance.now();

  resultElement.hidden = true;

  statusElement.textContent =
    "🏁 GO! FIND THE COOKIE!";

  bark();

  raceTimer =
    setInterval(
      raceStep,
      220
    );
}


/* =========================================
   RACE STEP
========================================= */

function raceStep() {

  /*
    Recalculate shortest-path distances
    from Cookie to every open square.

    The maze does NOT change.
  */

  const distanceMap =
    distanceFromCookie();

  /*
    Move each dog.

    Slightly random order means dogs
    don't always move in the same order.
  */

  const order =
    dogs
      .map((dog, index) => index)
      .sort(() =>
        Math.random() - 0.5
      );

  for (const index of order) {

    moveDog(
      dogs[index],
      distanceMap
    );

    /*
      Check immediately so two dogs
      arriving on the same tick are
      handled in movement order.
    */

    if (
      dogs[index].x === COOKIE.x &&
      dogs[index].y === COOKIE.y
    ) {

      finishRace(index);
      return;
    }
  }

  bark();

  draw();
}


/* =========================================
   FINISH
========================================= */

function finishRace(
  winnerIndex
) {

  clearInterval(
    raceTimer
  );

  raceTimer = null;

  raceRunning = false;

  const seconds =
    (
      (performance.now() -
       raceStart) / 1000
    ).toFixed(2);

  statusElement.textContent =
    "🏆 RACE FINISHED!";

  barkElement.textContent =
    `🐶 ${DOG_NAMES[winnerIndex]}: WOOOOOOF! 🍪`;

  resultElement.hidden = false;

  resultElement.innerHTML =
    `
      🏆 Winner:
      <strong>
        ${DOG_NAMES[winnerIndex]}
      </strong>
      <br>
      ⏱️ Time:
      <strong>
        ${seconds} seconds
      </strong>
    `;

  bark();

  draw();
}


/* =========================================
   NEW RACE
========================================= */

function newRace() {

  clearInterval(
    raceTimer
  );

  raceTimer = null;

  raceRunning = false;

  /*
    New maze.
  */

  createMaze();

  /*
    Reset dogs.

    Each dog starts with no direction,
    so the first move is chosen toward
    the Cookie.
  */

  dogs =
    STARTS.map(
      ([x, y]) => ({
        x,
        y,
        direction: null
      })
    );

  resultElement.hidden = true;

  statusElement.textContent =
    "Touch any dog to START!";

  barkElement.textContent =
    "🐾 TOUCH BOWIE, LOLLY, MORGAN OR MILLIE!";

  draw();
}


/* =========================================
   NEW RACE BUTTON
========================================= */

newRaceButton.addEventListener(
  "click",
  newRace
);


/* =========================================
   INITIAL GAME
========================================= */

newRace();

</script>

</body>
</html>
